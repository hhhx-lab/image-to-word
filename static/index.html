<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image to Word</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Image to Word</p>
            <h1>图片转可编辑 Word</h1>
          </div>
          <div class="status-pill" id="configStatus">检查配置中</div>
        </header>

        <div class="layout">
          <section class="panel upload-panel">
            <form id="uploadForm">
              <label class="dropzone" for="fileInput" id="dropzone">
                <input id="fileInput" name="file" type="file" accept=".png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff,.pdf" />
                <span class="drop-icon" aria-hidden="true">+</span>
                <span id="fileName">选择文件</span>
              </label>

              <div class="field-grid">
                <label>
                  <span>语言</span>
                  <select name="language">
                    <option value="ch" selected>中文</option>
                    <option value="en">英文</option>
                    <option value="auto">自动</option>
                  </select>
                </label>
                <label>
                  <span>模型</span>
                  <select name="model_version">
                    <option value="vlm" selected>vlm</option>
                    <option value="lite">lite</option>
                  </select>
                </label>
                <label>
                  <span>页码</span>
                  <input name="page_ranges" placeholder="1-3,5" />
                </label>
              </div>

              <div class="toggles">
                <label><input name="enable_formula" type="checkbox" checked /> 公式</label>
                <label><input name="enable_table" type="checkbox" checked /> 表格</label>
                <label><input name="is_ocr" type="checkbox" checked /> OCR</label>
              </div>

              <button class="primary" type="submit" id="submitBtn">开始转换</button>
            </form>

            <div class="job-log" id="jobLog">
              <div class="log-row muted">等待上传</div>
            </div>
          </section>

          <section class="panel preview-panel">
            <div class="preview-head">
              <div>
                <p class="eyebrow">Preview</p>
                <h2>生成结果</h2>
              </div>
              <div class="actions">
                <a class="ghost disabled" id="downloadDocx" href="#">导出 Word</a>
                <a class="ghost disabled" id="downloadMd" href="#">导出 Markdown</a>
              </div>
            </div>
            <div class="preview-tabs">
              <button type="button" class="tab active" data-mode="html">排版</button>
              <button type="button" class="tab" data-mode="markdown">Markdown</button>
            </div>
            <div class="preview" id="preview">
              <div class="empty-state">暂无结果</div>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
